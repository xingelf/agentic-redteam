name: Update KEV dashboard data

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:        # allow manual runs

permissions:
  contents: write

concurrency:
  group: kev-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data.json from the CISA KEV feed
        run: python3 scripts/build_kev.py

      - name: Commit if the data changed
        run: |
          if [[ -n "$(git status --porcelain viz/kev-dashboard/data.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add viz/kev-dashboard/data.json
            git commit -m "data: refresh KEV dashboard [skip ci]"
            git push
          else
            echo "No change in KEV data."
          fi
